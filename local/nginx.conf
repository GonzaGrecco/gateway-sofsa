# Re-resuelve los nombres con el DNS de Docker: sin esto, si se recrea una
# instancia de LiteLLM (cambia de IP) nginx sigue usando la IP vieja.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream litellm {
  zone litellm 64k;
  server litellm:4000 resolve;
  server litellm-2:4000 resolve;
}

server {
  listen 80;
  location / {
    proxy_pass http://litellm;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }
}
