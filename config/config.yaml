model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # SACO y SOFIA usan OpenAI hasta enero 2027; después los alias de chat y vision pasan a Claude.
  # Los embeddings siguen en OpenAI: cambiarlos obliga a re-indexar Qdrant.
  - model_name: saco-chat
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: saco-vision
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
  - model_name: saco-embeddings
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY
  - model_name: sofia-chat
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: sofia-embeddings
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  num_retries: 2
  # Con un solo deployment por modelo, el cooldown convierte un error puntual en 429 para todas
  # las apps. Reactivar al sumar un segundo deployment.
  disable_cooldowns: true
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  callbacks: ["prometheus"]
  json_logs: true
  request_timeout: 120
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Sin esto la consola no puede guardar credenciales de proveedores.
  store_model_in_db: true
