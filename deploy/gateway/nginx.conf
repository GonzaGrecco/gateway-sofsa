# Solo apunta al LiteLLM de esta VM: el reparto entre VMs lo hace el balanceador.

# Re-resuelve el nombre si se recrea el contenedor de LiteLLM (cambia de IP).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream litellm {
  zone litellm 64k;
  server litellm:4000 resolve;
}

server {
  listen 80;
  client_max_body_size 50m;

  location / {
    proxy_pass http://litellm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;          # para el streaming
  }
}
