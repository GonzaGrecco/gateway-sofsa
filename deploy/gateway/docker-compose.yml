services:
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.108.11@sha256:95253c31752cc3efc6c60f7e1a0ec064ede73ba48c19cc466a8af71e7fec48a7}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ../../config/${CONFIG_FILE:-config.yaml}:/app/config.yaml:ro
    env_file: ${ENV_FILE:-.env}
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?falta LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?falta LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@${DB_HOST:-postgres}:5432/litellm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      start_period: 300s                  # la primera vez corre las migraciones de la base
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      litellm: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    # En VM 1 se abre a la IP privada para VM 2: el firewall solo debe dejar pasar a VM 2.
    ports:
      - "${DATOS_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?falta REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${DATOS_IP:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
